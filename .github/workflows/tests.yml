name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check synthetic fixture output
        run: |
          python -m checkmate_quant.cli summary examples/synthetic_normal.csv --json
          python -m checkmate_quant.cli compare examples/synthetic_normal.csv examples/synthetic_harsh.csv --json
